

backend pentagon_sp_hd_tap_fortune_client_LOCAL_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    server-template sp_hd_tap_fortune_client_LOCAL_ 1 sp_hd_tap_fortune_client_LOCAL:80 check resolvers docker init-addr none

