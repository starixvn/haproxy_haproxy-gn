backend pentagon_gn_baccarat_ball_service_LOCAL_1_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    http-request set-path %[path,regsub(^/bacball-1[/]?,/,i)]
    server-template gn_baccarat_ball_service_LOCAL_1_ 1 gn_baccarat_ball_service_LOCAL_1:5000 check resolvers docker init-addr none

