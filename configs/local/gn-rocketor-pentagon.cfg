

backend pentagon_gn_game_api_LOCAL_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    server-template gn_game_api_LOCAL_ 2 gn_game_api_LOCAL:5000 check resolvers docker init-addr none

