backend pentagon_gn_user_service_UAT_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    http-request set-path %[path,regsub(^/uat/user[/]?,/,i)]
    server-template gn_user_service_UAT_ 2 gn_user_service_UAT:5000 check resolvers docker init-addr none

