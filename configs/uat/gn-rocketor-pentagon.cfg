

backend pentagon_gn_sg_api_UAT_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    server-template gn_sg_api_UAT_ 2 gn_sg_api_UAT:5000 check resolvers docker init-addr none

