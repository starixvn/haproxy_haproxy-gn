backend pentagon_sp_hd_user_service_UAT_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    http-request set-path %[path,regsub(^/user[/]?,/,i)]
    server-template sp_hd_user_service_UAT_ 2 sp_hd_user_service_UAT:5000 check resolvers docker init-addr none

