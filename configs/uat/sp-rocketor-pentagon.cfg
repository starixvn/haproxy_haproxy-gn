

backend pentagon_sp_hd_sg_api_SIT_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    server-template sp_hd_sg_api_SIT_ 2 sp_hd_sg_api_SIT:5000 check resolvers docker init-addr none

