

backend pentagon_mg_odds_feed_api_PROD_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    server-template mg_odds_feed_api_PROD_ 2 mg_odds_feed_api_PROD:5000 check resolvers docker init-addr none

backend pentagon_mg_soccer_marble_PROD_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    http-request set-path %[path,regsub(^/soccer-marble[/]?,/,i)]
    server-template mg_soccer_marble_PROD_ 1 mg_soccer_marble_PROD:3000 check resolvers docker init-addr none

backend pentagon_mg_mg_admin_api_PROD_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    http-request set-path %[path,regsub(^/api[/]?,/,i)]
    server-template mg_mg_admin_api_PROD_ 1 mg_mg_admin_api_PROD:5000 check resolvers docker init-addr none
