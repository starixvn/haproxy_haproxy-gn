

backend pentagon_gn_bac_ball_1_service_PROD_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    http-request set-path %[path,regsub(^/bacball1[/]?,/,i)]
    server-template gn_bac_ball_1_service_PROD_ 1 gn_bac_ball_1_service_PROD:5000 check resolvers docker init-addr none

