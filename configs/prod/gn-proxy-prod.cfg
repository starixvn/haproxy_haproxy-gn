

backend gn_user_service_PROD_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    http-request set-path %[path,regsub(^/user[/]?,/,i)]
    server-template gn_user_service_PROD_ 2 gn_user_service_PROD:5000 check resolvers docker init-addr none

