

backend pentagon_sp_hd_admin_site_PROD_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    server-template sp_hd_admin_site_PROD_ 1 sp_hd_admin_site_PROD:5000 check resolvers docker init-addr none

backend pentagon_sp_hd_user_service_PROD_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    http-request set-path %[path,regsub(^/user[/]?,/,i)]
    server-template sp_hd_user_service_PROD_ 3 sp_hd_user_service_PROD:5000 check resolvers docker init-addr none

