

backend gn_game_result_PROD_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    server-template gn_game_result_PROD_ 1 gn_game_result_PROD:5000 check resolvers docker init-addr none

