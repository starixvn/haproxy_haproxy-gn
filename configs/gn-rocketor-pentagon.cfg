

backend pentagon_gn_baccarat_ball_service_CLONED_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    http-request set-path %[path,regsub(^/bacball[/]?,/,i)]
    server-template gn_baccarat_ball_service_CLONED_ 1 gn_baccarat_ball_service_CLONED:5000 check resolvers docker init-addr none
